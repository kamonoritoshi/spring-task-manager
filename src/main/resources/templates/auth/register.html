<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Task Manager</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-success fs-1"></i>
                            <h4 class="fw-bold mt-2">Tạo tài khoản mới</h4>
                            <p class="text-muted small">Bắt đầu quản lý danh sách việc cần làm</p>
                        </div>

                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập</label>
                                <input type="text" th:field="*{username}" class="form-control"
                                    th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                    placeholder="Từ 3 đến 50 ký tự" required>
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                    placeholder="Nhập mật khẩu" required>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-semibold py-2">
                                <i class="bi bi-check-circle me-1"></i> Đăng ký tài khoản
                            </button>
                        </form>

                        <div class="text-center mt-4 small">
                            Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Đăng
                                nhập</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
