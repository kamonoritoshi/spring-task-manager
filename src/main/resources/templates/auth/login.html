<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Task Manager</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-check2-square text-primary fs-1"></i>
                            <h4 class="fw-bold mt-2">Đăng nhập hệ thống</h4>
                            <p class="text-muted small">Quản lý công việc cá nhân hiệu quả</p>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger py-2 small">
                            <i class="bi bi-exclamation-circle me-1"></i> Sai tên đăng nhập hoặc mật khẩu!
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info py-2 small">
                            <i class="bi bi-info-circle me-1"></i> Bạn đã đăng xuất khỏi hệ thống.
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success py-2 small"
                            th:text="${successMessage}"></div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập</label>
                                <input type="text" name="username" class="form-control"
                                    placeholder="Nhập username (vd: admin)" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" name="password" class="form-control"
                                    placeholder="Nhập mật khẩu (vd: 123456)" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                            </button>
                        </form>

                        <div class="text-center mt-4 small">
                            Chưa có tài khoản? <a th:href="@{/register}" class="text-decoration-none fw-semibold">Đăng
                                ký ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
